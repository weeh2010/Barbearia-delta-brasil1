<!DOCTYPE html>

<head>

<body>
<div class="box">

<a class="btn2" href="curso.html" onclick="return liberar()">2️⃣ JÁ PAGUEI, LIBERAR CURSO</a>

<script>

  if(confirm('Você já pagou os R$9,99 no Mercado Pago?')){

  return false;
}
</script>
