<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagar Curso - Barbearia Delta</title>
<style>
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:20px}
.box{max-width:400px;margin:50px auto;background:#222;padding:30px;border-radius:15px;border:2px solid #FFD700}
h1{color:#FFD700}
.btn{display:block;background:#FFD700;color:#000;padding:20px;font-size:22px;font-weight:bold;text-decoration:none;border-radius:10px;margin:20px 0}
.small{font-size:13px;color:#aaa;margin-top:20px}
.timer{font-size:14px;color:#0f0;margin-top:15px;display:none}
</style>
</head>
<body>
<div class="box">
<h1>💈 BARBEARIA DELTA</h1>
<h2>Curso Low Fade<br>De R$97 por R$9,99</h2>
<p>✅ Acesso imediato<br>✅ 3 aulas completas<br>✅ Acesso vitalício</p>

<a class="btn" onclick="pagar()" id="btnPagar">PAGAR R$9,99 AGORA</a>

<div class="timer" id="timer">✅ Pagamento detectado! Redirecionando em <span id="count">10</span>s...</div>

<p class="small">Pagamento 100% seguro via Mercado Pago<br>Após pagar, você volta e é redirecionado AUTOMATICAMENTE pro curso!</p>
</div>

<script>
function pagar(){
  localStorage.setItem('pagou','sim');
  document.getElementById('timer').style.display='block';
  let c=10;
  setInterval(()=>{c--; document.getElementById('count').innerText=c; if(c<=0){ window.location.href='curso.html?v=4'; }},1000);
  window.open('https://mpago.la/1MbBTJ2','_blank');
}
// Se a pessoa voltar do MP, já redireciona
if(localStorage.getItem('pagou')=='sim'){
  document.getElementById('timer').style.display='block';
  let c=10;
  setInterval(()=>{c--; document.getElementById('count').innerText=c; if(c<=0){ window.location.href='curso.html?v=4'; }},1000);
}
</script>
</body>
</html>
